<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
<defs>
<linearGradient id="gd-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5f3fc"></stop><stop offset="1" stop-color="#22d3ee"></stop></linearGradient>
<linearGradient id="gd-face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"></stop><stop offset="1" stop-color="#0b6f85"></stop></linearGradient>
<linearGradient id="gd-side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b6f85"></stop><stop offset="1" stop-color="#052e3a"></stop></linearGradient>
<linearGradient id="gd-vio" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"></stop><stop offset="1" stop-color="#8b5cf6"></stop></linearGradient>
<radialGradient id="gd-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0891b2" stop-opacity="0.18"></stop><stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.08"></stop><stop offset="1" stop-color="#22d3ee" stop-opacity="0"></stop></radialGradient>
</defs>
<circle cx="128" cy="128" r="118" fill="url(#gd-glow)"></circle>
<g transform="translate(128,128) scale(0.78) translate(-128.0,-128.0)">

<!-- isometric artboard: extruded slab -->
<polygon points="128.0,52.0 216.0,100.0 128.0,148.0 40.0,100.0" fill="url(#gd-top)"></polygon>
<polygon points="40.0,100.0 128.0,148.0 128.0,196.0 40.0,148.0" fill="url(#gd-side)"></polygon>
<polygon points="216.0,100.0 128.0,148.0 128.0,196.0 216.0,148.0" fill="url(#gd-face)"></polygon>

<!-- layout grid etched into the artboard -->
<g stroke="#052e3a" stroke-width="2.5" opacity="0.32" fill="none">
<path d="M84 76 L172 124"></path>
<path d="M172 76 L84 124"></path>
</g>

<!-- violet accent tile (the "brand" block) -->
<polygon points="128.0,64.0 172.0,88.0 128.0,112.0 84.0,88.0" fill="url(#gd-vio)"></polygon>

<!-- bezier curve with handles — the design gesture -->
<path d="M62 176 C 100 146, 156 198, 194 162" stroke="#a5f3fc" stroke-width="6" stroke-linecap="round" fill="none"></path>
<g stroke="#67e8f9" stroke-width="3" opacity="0.6" fill="none">
<path d="M62 176 L 100 146"></path>
<path d="M194 162 L 156 198"></path>
</g>
<circle cx="62" cy="176" r="10" fill="#a5f3fc"></circle>
<circle cx="100" cy="146" r="7" fill="url(#gd-vio)"></circle>
<circle cx="156" cy="198" r="7" fill="url(#gd-vio)"></circle>
<circle cx="194" cy="162" r="10" fill="#67e8f9"></circle>

<!-- colour swatches -->
<circle cx="96" cy="222" r="12" fill="url(#gd-vio)"></circle>
<circle cx="128" cy="222" r="12" fill="#22d3ee"></circle>
<circle cx="160" cy="222" r="12" fill="#a5f3fc"></circle>
</g>
</svg>
